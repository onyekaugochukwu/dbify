name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Run end-to-end tests in Chrome (hosted and single-file builds)
        run: npm test
        env:
          CHROME: /usr/bin/google-chrome
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Keep the single-file version as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbify-single-file
          path: dist/dbify.html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
